name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          # CI-only throwaway credentials; never reuse these outside this job.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: food_delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d food_delivery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_local_only@127.0.0.1:5432/food_delivery_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci_local_only@127.0.0.1:5432/food_delivery_test
      REDIS_URL: redis://127.0.0.1:6379
      DOTENV_CONFIG_PATH: .env.ci-does-not-exist
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
      # Redis-backed tests must run, not skip (tests/ci-environment.test.ts).
      REQUIRE_REDIS: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Check OpenAPI coverage
        run: npm run check:openapi

      - name: Check formatting
        run: npm run format:check

      - name: Run integration and smoke tests
        run: npm test

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Browser tests (isolated schema, deterministic geocoding and routing)
        run: npm run test:e2e

      - name: Browser tests with automatic assignment enabled
        run: npx playwright test tests/browser/offer-flow.spec.ts
        env:
          ASSIGNMENT_AUTOMATION_ENABLED: 'true'

      - name: Upload browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
