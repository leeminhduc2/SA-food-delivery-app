name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # CI-only throwaway credentials; never reuse these outside this job.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: food_delivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d food_delivery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_local_only@127.0.0.1:5432/food_delivery_test?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci_local_only@127.0.0.1:5432/food_delivery_test
      PRISMA_HIDE_UPDATE_MESSAGE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Check OpenAPI coverage
        run: npm run check:openapi

      - name: Check formatting
        run: npm run format:check

      - name: Run integration and smoke tests
        run: npm test

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
