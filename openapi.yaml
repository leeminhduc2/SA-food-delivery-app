  /api/admin/monitoring/summary:
    get:
      tags: [Admin]
      operationId: getAdminMonitoringSummary
      summary: Driver availability and pending work counts
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Online, ready, busy, pending search and pending payment counts }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/alerts:
    get:
      tags: [Admin]
      operationId: listOperationalAlerts
      summary: Open delivery incidents and exhausted searches with acknowledgement state
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Up to 100 open alerts }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/alerts/{kind}/{id}/acknowledge:
    parameters:
      - {
          in: path,
          name: kind,
          required: true,
          schema: { type: string, enum: [EXHAUSTED, INCIDENT] },
        }
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Admin]
      operationId: acknowledgeOperationalAlert
      summary: Acknowledge an alert without changing its business state
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      responses:
        '200': { description: Original acknowledgement timestamp and administrator ID }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/driver/offers/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Delivery]
      operationId: acceptDriverOffer
      summary: Atomically accept your current offer
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      responses:
        '200': { description: Assignment created or previous result replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/driver/offers/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Delivery]
      operationId: rejectDriverOffer
      summary: Reject your current offer with a reason
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey, reason]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200': { description: Offer rejected or previous result replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/driver/heartbeat:
    post:
      tags: [Delivery]
      operationId: driverHeartbeat
      summary: Refresh online driver heartbeat
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      responses:
        '200': { description: Availability snapshot }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/driver/deliveries/history:
    get:
      tags: [Delivery]
      operationId: driverDeliveryHistory
      summary: List the signed-in driver's assignment history
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Assignment metadata and opaque next cursor
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/restaurants/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Admin]
      operationId: suspendRestaurant
      summary: Hide and pause a restaurant for a documented reason
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, idempotencyKey]
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      responses:
        '200': { description: Restaurant suspended or request replayed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin]
      operationId: setUserActive
      summary: Enable or disable an account
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountStatusInput' }
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/complaints/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Admin]
      operationId: resolveComplaint
      summary: Resolve an open complaint
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolutionInput' }
      responses:
        '200':
          description: Complaint resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/restaurants/import:
    post:
      tags: [Admin]
      operationId: startRestaurantImport
      summary: Queue an OpenStreetMap restaurant import (admin)
      description: |
        Runs in the background and returns a job id. The Overpass endpoint is
        server-configured; callers cannot supply a URL. Only one import may run
        at a time. Imported restaurants are PENDING and unverified.
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '202':
          description: Import queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportQueued' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/restaurants/import/history:
    get:
      tags: [Admin]
      operationId: listRestaurantImports
      summary: Recent import jobs and statistics (admin)
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Import history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    patch:
      tags: [Admin]
      operationId: moderateReview
      summary: Hide or restore a review
      security: [{ sessionCookie: [], requestedWithHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewModerationInput' }
      responses:
        '200':
          description: Review moderated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
