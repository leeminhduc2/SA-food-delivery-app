      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, otp, idempotencyKey]
              properties:
                challengeId: { type: string }
                otp: { type: string, pattern: '^\d{6}$' }
                idempotencyKey: { type: string, minLength: 8, maxLength: 120 }
      responses:
        '200': { description: Verified proof ID and method }
        '400': { $ref: '#/components/responses/BadRequest' }
