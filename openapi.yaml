  /api/deliveries/{id}/proofs/otp:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Delivery]
      operationId: verifyDeliveryOtp
      summary: Verify the customer's code for the current driver assignment
      description: Failed attempts are committed once per idempotency key; replaying a key returns its original outcome without consuming another attempt.
