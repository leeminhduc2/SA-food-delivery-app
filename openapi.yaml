                  target:
                    type: object
                    required: [name, latitude, longitude]
                    properties:
                      name: { type: string }
                      latitude: { type: number }
                      longitude: { type: number }
                  distanceMeters: { type: number }
                  durationSeconds: { type: number }
                  routeGeometry:
                    type: object
                    required: [type, coordinates]
                    properties:
                      type: { type: string, const: LineString }
