    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Delivery]
      operationId: uploadDeliveryPhoto
      summary: Upload a private delivery photo for the current assignment
      description: Raw JPEG or PNG body up to DELIVERY_PROOF_MAX_BYTES. The magic bytes must match Content-Type. VERIFIED means the file was validated and stored, not that the scene was checked. Replaying a key returns the original proof; a different photo with the same key conflicts.
